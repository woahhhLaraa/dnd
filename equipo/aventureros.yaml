descripciones:
  Abrojos: "Acción de utilizar: esparces los abrojos de tu bolsa para cubrir una zona cuadrada de 1,5 m de lado a 1,5 m o menos de ti. Las criaturas que entren en la zona por primera vez en un turno hacen TdS de Destreza CD 15 o sufren 1 de daño perforante y su velocidad se reduce a 0 hasta el principio de su siguiente turno. Se tarda 10 minutos en recuperarlos."
  Aceite: "Puedes empapar a una criatura, un objeto o un espacio, o usarlo como combustible. Empapar a una criatura u objeto: sustituyes uno de tus ataques por lanzar un frasco a un objetivo a 6 m o menos; TdS de Destreza (CD 8 + mod. Destreza + bonif. competencia) o queda cubierto de aceite, y si sufre daño de fuego antes de que se seque (1 minuto), recibe 5 de daño de fuego adicional. Empapar un espacio: acción de utilizar para cubrir una zona cuadrada de 1,5 m de lado a 1,5 m o menos de ti; si se prende, arde 2 asaltos e inflige 5 de daño de fuego a quien entre o termine su turno ahí (una vez por turno). Combustible: un frasco prendido arde 6 horas en lámpara o linterna (no necesariamente consecutivas)."
  Ácido: "Al llevar a cabo la acción de atacar, puedes sustituir uno de tus ataques por lanzar un vial de ácido a una criatura u objeto a 6 m o menos. TdS de Destreza (CD 8 + mod. Destreza + bonif. competencia) o sufre 2d6 de daño de ácido."
  "Agua bendita": "Sustituyes uno de tus ataques por lanzar un frasco a una criatura a 6 m o menos. TdS de Destreza (CD 8 + mod. Destreza + bonif. competencia) o sufre 2d8 de daño radiante si es un infernal o un muerto viviente."
  Aljaba: "En una aljaba caben hasta 20 flechas."
  Antitoxina: "Acción adicional para beber un vial y obtener ventaja en TdS para evitar o poner fin al estado de envenenado durante 1 hora."
  Antorcha: "Arde 1 hora, luz brillante 6 m y tenue 6 m más. Puede usarse como arma cuerpo a cuerpo sencilla; si acierta, 1 de daño de fuego."
  "Ariete portátil": "Bonificador de +4 a la prueba de Fuerza para derribar puertas. Con ayuda de otro personaje, ventaja en la prueba."
  Barril: "Caben 160 l de líquido o 120 l de mercancías secas."
  "Bolas de metal": "Acción de utilizar para esparcirlas y cubrir una zona cuadrada y plana de 3 m de lado a 3 m o menos de ti. Quien entre por primera vez en un turno hace TdS de Destreza CD 10 o queda derribado. Se tarda 10 minutos en recuperarlas."
  Bolsa: "Soporta hasta 3 kg en un volumen de 6 l."
  "Botella de cristal": "Caben hasta 0,75 l de líquido."
  Cadena: "Acción de utilizar para atar a una criatura no voluntaria a 1,5 m o menos que esté agarrada, apresada o incapacitada, si superas Fuerza (Atletismo) CD 13. Si tiene las piernas atadas, queda apresada hasta liberarse (Destreza [Acrobacias] CD 18 como acción). Romperla requiere Fuerza (Atletismo) CD 20 como acción."
  Campana: "Al tañerla (acción de utilizar) produce un sonido audible a 18 m."
  "Canalizador arcano": "Objeto de la tabla 'Canalizadores arcanos', ornamentado para canalizar magia arcana. Brujos, hechiceros o magos pueden usarlo como canalizador mágico."
  "Canalizador druídico": "Objeto de la tabla 'Canalizadores druídicos', tallado, atado con un lazo o pintado para canalizar magia primigenia. Druidas o exploradores pueden usarlo como canalizador mágico."
  Cantimplora: "Caben hasta 2 l de líquido. No beber suficiente agua arriesga deshidratación."
  Catalejo: "Los objetos vistos a través de él se ven al doble de su tamaño real."
  Cerradura: "Viene con una llave. Sin ella, se puede forzar con herramientas de ladrón superando Destreza (Juego de manos) CD 15."
  Cesta: "Soporta hasta 20 kg en un volumen de 60 l."
  Cofre: "Cabe un volumen de hasta 360 l de contenido."
  Cordel: "Mide 3 m de longitud. Acción de utilizar para atar un nudo."
  Cubo: "Cabe un volumen de 15 l de contenido."
  Cuerda: "Acción de utilizar para hacer un nudo (Destreza [Juego de manos] CD 10) o romperla (Fuerza [Atletismo] CD 20). Puede atar a una criatura no voluntaria solo si está agarrada, apresada o incapacitada; con las piernas atadas queda apresada hasta liberarse (Destreza [Acrobacias] CD 15 como acción)."
  Disfraz: "Ventaja en pruebas de característica para hacerte pasar por la persona o tipo de persona que representa, mientras lo lleves puesto."
  Escalera: "Mide 3 m de altura. Hay que trepar para subir o bajar por ella."
  Espejo: "Espejito de acero portátil; útil para arreglarse, mirar por esquinas o reflejar luz como señal."
  Esposas: "Acción de utilizar para esposar a una criatura Pequeña o Mediana no voluntaria a 1,5 m o menos que esté agarrada, apresada o incapacitada, si superas Destreza (Juego de manos) CD 13. Mientras esté esposada, desventaja en tiradas de ataque, y apresada si las esposas están sujetas a algo fijo. Liberarse: Destreza (Juego de manos) CD 20 como acción; romperlas: Fuerza (Atletismo) CD 25 como acción. Vienen con llave; sin ella, herramientas de ladrón y Destreza (Juego de manos) CD 15."
  "Estuche para mapas o pergaminos": "Caben hasta 10 hojas de papel o 5 hojas de pergamino."
  "Estuche para virotes de ballesta": "Caben hasta 20 virotes."
  Frasco: "Caben hasta 0,5 l de líquido."
  "Fuego de alquimista": "Sustituyes uno de tus ataques por lanzar un frasco a una criatura u objeto a 6 m o menos. TdS de Destreza (CD 8 + mod. Destreza + bonif. competencia) o sufre 1d4 de daño de fuego y comienza a arder."
  "Garfio de escalada": "Acción de utilizar para lanzarlo a una barandilla, cornisa u otro saliente a 15 m o menos; se engancha si superas Destreza (Acrobacias) CD 13. Con una cuerda atada, permite escalar."
  Jarro: "Caben hasta 4 l de líquido."
  Lámpara: "Quema aceite como combustible para emitir luz brillante en un radio de 4,5 m y luz tenue 9 m más allá."
  Libro: "Contiene ficción o no ficción. Si consultas un libro veraz de no ficción sobre su materia, ganas +5 a las pruebas de Inteligencia (Conocimiento arcano, Historia, Naturaleza o Religión) que hagas sobre esa materia."
  "Linterna de ojo de buey": "Quema aceite como combustible para emitir luz brillante en un cono de 18 m y luz tenue 18 m más allá."
  "Linterna sorda": "Quema aceite como combustible para emitir luz brillante en un radio de 9 m y luz tenue 9 m más allá. Acción adicional para cubrir la abertura con la tapa y que solo emita luz tenue en un radio de 1,5 m, o abrirla de nuevo."
  Lupa: "Ventaja en pruebas de característica para tasar o inspeccionar un objeto muy detallado. Para encender un fuego con ella se necesita luz tan brillante como la del sol, yesca y unos 5 minutos."
  Manta: "Envuelto en ella, ventaja en TdS contra el frío extremo."
  Mapa: "Si consultas un mapa preciso, +5 a las pruebas de Sabiduría (Supervivencia) para orientarte en el lugar representado."
  Mochila: "Soporta hasta 15 kg en un volumen de 30 l. También puede servir de alforja."
  # La tabla «Munición» que cita este párrafo está desglosada como registros
  # consultables en equipo/municion.yaml (mismos datos, sin reinterpretar).
  Munición: "Las armas con la propiedad de munición la requieren para atacar; la tabla 'Munición' indica tipos, cantidad obtenida al comprar, y el recipiente habitual (que debe comprarse aparte): balas de arma de fuego (10, bolsa, 1 kg, 3 po), dardos (50, bolsa, 0,5 kg, 1 po), flechas (20, aljaba, 0,5 kg, 1 po), proyectiles de honda (20, bolsa, 0,75 kg, 4 pc), virotes (20, estuche, 0,75 kg, 1 po)."
  "Olla de hierro": "Caben hasta 4 l."
  Pala: "Con 1 hora de trabajo, cava un agujero cúbico de 1,5 m de lado en tierra o material similar."
  Palanqueta: "Da ventaja en pruebas de Fuerza en las que se pueda hacer palanca."
  Papel: "En una hoja caben unas 250 palabras escritas a mano."
  "Paquete de artista": "Contiene: campana, cantimplora, 3 disfraces, espejo, 8 frascos de aceite, linterna de ojo de buey, mochila, petate, raciones para 9 días y yesquero."
  "Paquete de diplomático": "Contiene: cofre, 2 estuches para mapas o pergaminos, 4 frascos de aceite, 5 hojas de papel, 5 hojas de pergamino, lámpara, perfume, 5 plumas, ropas de calidad, tinta y yesquero."
  "Paquete de erudito": "Contiene: 10 frascos de aceite, 10 hojas de pergamino, lámpara, libro, mochila, pluma, tinta y yesquero."
  "Paquete de explorador": "Contiene: 10 antorchas, cantimplora, cuerda, 2 frascos de aceite, mochila, petate, raciones para 10 días y yesquero."
  "Paquete de explorador de mazmorras": "Contiene: abrojos, 10 antorchas, cantimplora, cuerda, 2 frascos de aceite, mochila, palanqueta, raciones para 10 días y yesquero."
  "Paquete de ladrón": "Contiene: bolas de metal, campana, cantimplora, cuerda, 7 frascos de aceite, linterna sorda, mochila, palanqueta, raciones para 5 días, 10 velas y yesquero."
  "Paquete de sacerdote": "Contiene: agua bendita, lámpara, manta, mochila, raciones para 7 días, túnica y yesquero."
  Perfume: "Viene en un vial de 120 ml. Tras ponértelo, durante 1 hora tienes ventaja en pruebas de Carisma (Persuasión) para influir en un humanoide indiferente a 1,5 m o menos."
  Pergamino: "En una hoja caben unas 250 palabras escritas a mano."
  "Pergamino de conjuro": "Objeto mágico que contiene las palabras de un truco (30 po) o de un conjuro de nivel 1 (50 po). Si el conjuro está en la lista de tu clase, puedes leerlo y lanzarlo con su tiempo de lanzamiento normal sin componentes materiales. Si requiere TdS o tirada de ataque, la CD es 13 y el bonificador de ataque +5. Se desintegra al completarse el lanzamiento."
  Petate: "Puede dormir en él una criatura Pequeña o Mediana. Mientras estés en uno, superas automáticamente los TdS contra el frío extremo."
  Pluma: "Sirve para escribir o dibujar con tinta."
  "Poción de curación": "Objeto mágico. Acción adicional para beberla o administrarla a otra criatura a 1,5 m o menos; recupera 2d4 + 2 PG."
  Polipasto: "Permite levantar hasta cuatro veces el peso que normalmente puedes levantar."
  "Puntas de hierro": "Vienen en lotes de diez. Acción de utilizar con un objeto romo para clavar una en madera, tierra u otra materia similar; sirve para atrancar una puerta o atar después una cuerda o cadena."
  Raciones: "Alimentos propicios para viajar: cecina, fruta deshidratada, galletas y frutos secos."
  Red: "Sustituyes uno de tus ataques por lanzarla a una criatura a 4,5 m o menos. TdS de Destreza (CD 8 + mod. Destreza + bonif. competencia) o queda apresada hasta liberarse (automático si es Enorme o más grande). Liberarse: acción y Fuerza [Atletismo] CD 10 (el objetivo o alguien a 1,5 m o menos). Se puede destruir (CA 10, 5 PG; inmune a contundente, psíquico y veneno)."
  "Ropas de calidad": "Confeccionadas con telas caras y detalles elaborados. Algunos eventos y lugares admiten solo a quien las lleve."
  "Ropas de viaje": "Prendas resistentes diseñadas para viajar por diversos entornos."
  Saco: "Soporta hasta 15 kg en un volumen de 30 l."
  "Saquito de componentes": "Bolsa hermética con compartimentos que contiene todos los componentes materiales gratuitos para tus conjuros."
  "Silbato de supervivencia": "Al soplarlo (acción de utilizar) produce un sonido audible a 180 m."
  "Símbolo sagrado": "Objeto de la tabla 'Símbolos sagrados' (amuleto puesto o sostenido, emblema en tela o escudo, relicario sostenido), ornamentado para canalizar magia divina. Clérigos o paladines pueden usarlo como canalizador mágico."
  Tienda: "Pueden dormir hasta dos criaturas Pequeñas o Medianas."
  Tinta: "Viene en un frasco de 30 ml que basta para escribir unas 500 páginas."
  "Trampa para cazar": "Acción de utilizar para ponerla: anilla dentada de acero que se cierra al pisar una placa de presión central, fijada con una cadena a un objeto inmóvil. Quien la pise hace TdS de Destreza CD 13 o sufre 1d4 de daño perforante y su velocidad se reduce a 0 hasta el principio de su siguiente turno; después su movimiento queda limitado por la cadena (normalmente 90 cm). Liberarse (a sí misma u otra a su alcance): acción y Fuerza (Atletismo) CD 13; cada fallo causa 1 de daño perforante."
  Túnica: "Tiene significado vocacional y ceremonial. Algunos eventos y lugares admiten solo a quien la vista con determinados colores o símbolos."
  "Útiles de escalada": "Incluyen arnés, guantes, pitones y puntas para las botas. Acción de utilizar para anclarte: mientras estés anclado, no puedes caer más de 7,5 m desde el punto de anclaje ni alejarte más de 7,5 m sin quitar la sujeción (acción adicional)."
  "Útiles de sanador": "Tienen diez usos. Acción de utilizar para gastar uno y estabilizar a una criatura inconsciente con 0 PG sin necesidad de prueba de Sabiduría (Medicina)."
  Vara: "Mide 3 m. Sirve para tocar algo a hasta 3 m de distancia. En un salto de altura o longitud, impulsarte con ella da ventaja en la prueba de Fuerza (Atletismo)."
  Vela: "Durante 1 hora emite luz brillante en un radio de 1,5 m y luz tenue 1,5 m más allá."
  "Veneno básico": "Acción adicional para impregnar un arma o hasta tres unidades de munición. Quien sufra daño cortante o perforante del arma o munición envenenadas recibe 1d4 de daño de veneno adicional. Mantiene su efectividad 1 minuto o hasta infligir su daño."
  Vial: "Caben 120 ml de líquido."
  Yesquero: "Pequeño recipiente con pedernal, chispero y yesca; sirve para encender fuego. Acción adicional para prender con él una antorcha, lámpara, linterna o vela (u otra cosa con combustible expuesto). Encender cualquier otro fuego lleva 1 minuto."

monturas_y_vehiculos:
  reglas:
    - "Un animal enganchado a una carreta, carro, carro de guerra, carruaje o trineo puede tirar de hasta cinco veces su capacidad de carga base, incluido el peso del vehículo. Si varios animales tiran del mismo vehículo, se suman sus capacidades de carga."
    - "Barda: armadura diseñada para una montura. Cualquier tipo de la tabla de armaduras puede comprarse en forma de barda; cuesta el cuádruple de lo normal y pesa el doble."
    - "Silla militar: da ventaja en cualquier prueba de característica para permanecer montado. Se necesita silla exótica para montar en una montura acuática o voladora."
