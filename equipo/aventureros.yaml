# No tienen precio: no es que falte el dato, es que no existe. Registrarlos
# aquí los hace consultables sin inventarles un coste.
objetos_de_rasgo_de_clase:
  - nombre: "Libro de conjuros"
    concedido_por: {clase: Mago, rasgo: "Lanzamiento de conjuros", nivel: 1}
    fuente: {pagina_pdf: 139, pagina_libro: 137}
    verificado: {metodo: "vision-directa", fecha: "2026-08-19"}
    tamano: Diminuto
    peso_kg: 1.5
    paginas: 100
    precio: null
    precio_nota: >-
      No se vende. La tabla «Equipo de aventureros» (pdf 225 = libro 223) pasa
      de «Libro» a «Linterna de ojo de buey» sin entrada intermedia, y la
      descripción de «Libro» (25 po, pdf 228 = libro 226) es un libro de
      ficción o no ficción que da +5 a pruebas de Inteligencia: no es un libro
      de conjuros. El del Mago nace del rasgo, no de la bolsa.
    desc: >-
      Objeto Diminuto de 1,5 kg y 100 páginas; solo puedes leerlo tú o quien
      lance identificar. Tú decides su apariencia y materiales. Contiene los
      conjuros de nivel 1 y superiores que conoces. Sirve también como
      canalizador mágico del Mago.
