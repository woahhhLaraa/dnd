objetos_magicos:
  identificar: "El conjuro identificar revela las propiedades de un objeto mágico. Alternativamente, concentrarte en él durante un descanso corto en contacto físico revela sus propiedades y cómo usarlas (pero no si tiene una maldición). Algunas propiedades se descubren poniéndose o experimentando con el objeto (p. ej., probar una poción, o que el DM dé una pista narrativa al usarlo)."
  sintonizacion:
    regla: "Algunos objetos mágicos requieren sintonización antes de usar sus propiedades mágicas; sin sintonizarte, solo obtienes sus beneficios no mágicos (salvo que el objeto indique otra cosa)."
    proceso: "Se logra pasando un descanso corto entero concentrándote solo en el objeto en contacto físico con él (no puede ser el mismo descanso usado para identificarlo). Si el descanso se interrumpe, falla."
    limite: "No puedes sintonizarte con más de tres objetos mágicos a la vez, ni con más de una copia del mismo objeto."
    terminar: "La sintonización termina si dejas de cumplir sus requisitos, si el objeto pasa 24 horas a más de 30 m de ti, si mueres, si otra criatura se sintoniza con él, o voluntariamente dedicando otro descanso corto (salvo que el objeto esté maldito)."
  vestir_y_empuñar: "Un objeto diseñado para vestirse debe llevarse de la forma adecuada (botas en los pies, anillos en los dedos, etc.); las armas deben empuñarse. Normalmente vale para cualquier tamaño o complexión. No puedes llevar más de un objeto del mismo tipo emparejado (un par de botas, guantes, brazales, una armadura, un objeto de cabeza o una capa), salvo excepción del DM. Los objetos que vienen en pares (botas, brazales, guanteletes, guantes) solo dan sus beneficios si se llevan los dos del mismo par."

fabricar_equipo:
  objetos_no_magicos:
    herramientas: "Se necesita la herramienta indicada en el apartado 'Herramientas' de este capítulo (o la que asigne el DM) y ser competente con ella; cualquiera que ayude también debe serlo."
    materias_primas: "Se necesitan materias primas que valgan la mitad del precio de compra del objeto (redondeando abajo)."
    tiempo: "Divide el precio de compra en po entre 10 (redondeando fracciones hacia arriba como un día entero) para saber los días necesarios, dedicando 8 horas al día; no tienen por qué ser consecutivos. Varios personajes pueden repartirse el tiempo dividiéndolo entre el número de trabajadores (normalmente solo puede ayudar uno más, salvo que el DM permita más)."
  pociones_de_curacion: "Quien tenga competencia con útiles de herborista puede crear pociones de curación invirtiendo 25 po de materias primas y 1 día (8 horas) de trabajo con los útiles."
  pergaminos_de_conjuro:
    requisitos: "Ser competente en Conocimiento arcano o con suministros de calígrafo, y tener el conjuro preparado cada día de trabajo, con cualquier componente material que requiera a mano (se consume solo al terminar el pergamino si el conjuro los consume)."
    trucos: "La versión en pergamino de un truco funciona como si el lanzador tuviera el nivel del creador."
    mecanica: "Usa la CD de salvación de conjuros y el bonificador de ataque de conjuros del creador."
    costes:
      - {nivel: Truco, tiempo: "1 día", coste: "15 po"}
      - {nivel: 1, tiempo: "1 día", coste: "25 po"}
      - {nivel: 2, tiempo: "3 días", coste: "100 po"}
      - {nivel: 3, tiempo: "5 días", coste: "150 po"}
      - {nivel: 4, tiempo: "10 días", coste: "1000 po"}
      - {nivel: 5, tiempo: "25 días", coste: "1500 po"}
      - {nivel: 6, tiempo: "40 días", coste: "10000 po"}
      - {nivel: 7, tiempo: "50 días", coste: "12500 po"}
      - {nivel: 8, tiempo: "60 días", coste: "15000 po"}
      - {nivel: 9, tiempo: "120 días", coste: "50000 po"}

