edicion: "2024 (5.5e)"
fuente: {archivo: "Manual_del_Jugador_2024.pdf", paginas_pdf: "215-217"}
verificado: {metodo: "vision-directa", fecha: "2026-08-19"}
fidelidad: "estructurado"   # tabla de datos: daño, propiedades, peso, precio

propiedades:
  "a dos manos": "Requiere el uso de las dos manos."
  alcance: "El alcance de un arma a distancia aparece entre paréntesis tras 'arrojadiza' o 'munición': primero el alcance normal, luego el alcance largo, ambos en metros. Atacar más allá del alcance normal da desventaja; no se puede atacar más allá del alcance largo."
  arrojadiza: "Puede lanzarse para hacer un ataque a distancia, y puede desenvainarse como parte del ataque. Si es un arma cuerpo a cuerpo, las tiradas de ataque y de daño usan el mismo modificador de característica que para ataques cuerpo a cuerpo con ella."
  "gran alcance": "El alcance aumenta 1,5 m tanto al atacar como a efectos de ataques de oportunidad."
  ligera: "Al llevar a cabo la acción de atacar y atacar con un arma ligera, se puede hacer un ataque extra como acción adicional más adelante en el mismo turno, con otra arma ligera; no se suma el modificador de característica al daño del ataque extra salvo que sea negativo."
  municion: "Solo se puede atacar a distancia con un arma de munición si se tiene munición para ella; cada ataque gasta una unidad. Cargar un arma de una mano requiere una mano libre. Tras un combate, se puede dedicar 1 minuto a recuperar la mitad de la munición usada (redondeando abajo)."
  pesada: "Desventaja en tiradas de ataque si es cuerpo a cuerpo y Fuerza < 13, o si es a distancia y Destreza < 13."
  recarga: "Al atacar con una acción, acción adicional o reacción, solo se puede disparar una unidad de munición, aunque normalmente se pudiera hacer más de un ataque."
  sutil: "Las tiradas de ataque y de daño pueden hacerse con Fuerza o con Destreza (el mismo modificador para ambas)."
  versatil: "Puede usarse con una o dos manos; el valor entre paréntesis es el daño al usarse a dos manos para un ataque cuerpo a cuerpo."

propiedades_de_maestria:
  debilitar: "Si aciertas a una criatura con esta arma, tendrá desventaja en su próxima tirada de ataque antes del principio de tu siguiente turno."
  derribar: "Si aciertas a una criatura con esta arma, puedes obligarla a un TdS de Constitución (CD 8 + mod. característica de ataque + bonif. competencia); si lo falla, queda derribada."
  empujar: "Si aciertas a una criatura con esta arma, puedes empujarla hasta 3 m en línea recta si es Grande o más pequeña."
  hender: "Si aciertas con un ataque cuerpo a cuerpo con esta arma, puedes atacar cuerpo a cuerpo a una segunda criatura a 1,5 m o menos de la primera y a tu alcance; si aciertas, sufre el daño del arma sin tu modificador de característica salvo que sea negativo. Una vez por turno."
  mellar: "Puedes hacer el ataque extra de la propiedad 'ligera' como parte de la acción de atacar en vez de como acción adicional. Una vez por turno."
  molestar: "Si aciertas a una criatura con esta arma y le causas daño, tienes ventaja en tu siguiente tirada de ataque contra ella antes del final de tu siguiente turno."
  ralentizar: "Si aciertas a una criatura con esta arma y le causas daño, puedes reducir su velocidad en 3 m hasta el principio de tu siguiente turno. Con más de un ataque de armas con esta propiedad, la reducción no supera los 3 m."
  rozar: "Si tu tirada de ataque con esta arma falla contra una criatura, puedes causarle un daño igual a tu modificador de característica usado en el ataque, del mismo tipo que el arma."

