# Esta ficha entró en la base el 2026-09-06 y de dónde sale importa: la eligió
# la FILA 8 del censo, no una idea de personaje. Esa fila cuenta los efectos
# declarados que ninguna ficha con lectura independiente sostiene —se pueden
# corromper y todo sigue en verde—, y esta cierra SEIS de los dieciocho que
# quedaban, más que ninguna otra combinación posible:
#
#   · «Aura de celeridad» (add y conditional) y «Defensa gloriosa», del
#     Juramento de Gloria, que ninguna ficha de la base juraba;
#   · las tres dotes generales que tocan CA o velocidad y que nadie tomaba.
#
# **La Destreza es 16 a propósito.** «Maestro en armaduras medias» sube el tope
# del modificador por Destreza de 2 a 3 dentro de la fórmula de la armadura
# (el único `modifica_tope` de toda la base). Con Destreza 15 el tope subiría y
# el número no cambiaría: la ficha DECLARARÍA el efecto sin ejercitarlo, que es
# exactamente la decoración que la fila 8 existe para contar. Con 16, la CA es
# 18 en vez de 17, y corromper ese efecto rompe esta ficha.
#
# Las tres mejoras de característica (niveles 4, 8 y 12) se gastan en dotes, no
# en puntuación: por eso `mejoras:` va vacía y cada dote declara su `sube:`.

