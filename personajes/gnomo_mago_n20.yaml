  # Lo escribió el motor, no una lectura independiente de la
  # página. Ver `PLAN_20_AUDITORIA.md` §1.2.
  _origen: {metodo: motor, informe: null, fecha: "2026-09-05"}
  pg_max: 142
  ca: 13
  bonif_competencia: 6
  velocidad: 9
  cd_conjuros: 19
  bonif_ataque_conjuros: 11
decisiones:
- en: nivel 3
  eleccion: 'subclase: Evocador'
  cita:
    archivo: clases/mago.yaml
    campo: progresion[n=3].rasgos
- en: niveles 4, 8, 12 y 16
  eleccion: 'mejoras de característica: Int +2; Int +1 y Des +1; Con +2; Des +2'
  cita:
    archivo: dotes/generales.yaml
    registro: Mejora de característica
- en: niveles 2-20
  eleccion: 'PG: valor establecido (4) en cada subida, sin tirar'
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: puntos_golpe.niveles_siguientes_al_1
- en: creación
  eleccion: 'método de características: conjunto estándar (15/14/13/12/10/8)'
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: metodos_generacion_caracteristicas.conjunto_estandar
- en: creación
  eleccion: 'reparto base: Int 15, Des 14, Con 13, Sab 12, Car 10, Fue 8'
  cita:
    archivo: clases/mago.yaml
    campo: atributos_basicos.caracteristica_principal
- en: creación
  eleccion: 'ajuste de trasfondo: +2 Inteligencia, +1 Constitución'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Erudito
    campo: caracteristicas
- en: creación
  eleccion: 'linaje gnomo: Gnomo de los bosques, aptitud mágica Inteligencia'
  cita:
    archivo: especies/especies.yaml
    registro: Gnomo
    campo: linajes
- en: creación
  eleccion: 'habilidades de clase: Investigación, Perspicacia (distintas de las fijas del trasfondo para no solapar)'
  cita:
    archivo: clases/mago.yaml
    campo: atributos_basicos.habilidades
- en: creación
  eleccion: equipo inicial opción A (clase y trasfondo)
  cita:
    archivo: clases/mago.yaml
    campo: atributos_basicos.equipo_inicial.a
- en: creación
  eleccion: 'libro de conjuros: nace del rasgo, no de la opción A/B'
  cita:
    archivo: equipo/aventureros.yaml
    campo: objetos_de_rasgo_de_clase
- en: creación
  eleccion: 'trucos de clase (3): Descarga de fuego, Mano de mago, Prestidigitación'
  cita:
    archivo: clases/rasgos/mago.yaml
    rasgo: Lanzamiento de conjuros
- en: creación
  eleccion: 'preparados de clase (4): Armadura de mago, Escudo, Proyectil mágico, Detectar magia'
  cita:
    archivo: clases/rasgos/mago.yaml
    rasgo: Lanzamiento de conjuros
- en: creación
  eleccion: 'dote Iniciado en la magia (mago): trucos Luz y Reparar; preparado Identificar'
  cita:
    archivo: dotes/origen.yaml
    registro: Iniciado en la magia
- en: creación
  eleccion: 'linaje Gnomo de los bosques: truco Ilusión menor; preparado Hablar con animales'
  cita:
    archivo: especies/especies.yaml
    registro: Gnomo
    campo: linajes
- en: creación
  eleccion: 'idiomas: Común, Gnomo, Elfo'
  cita:
    archivo: reglas/idiomas.yaml
    campo: nota
