calculado:
  pg_max: 10
  ca: 14
  bonif_competencia: 2
  velocidad: 9
decisiones:
- en: creación
  eleccion: conjunto estándar por sugerencia de clase para Pícaro
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: conjunto_estandar_por_clase
- en: creación
  eleccion: 'ajuste de trasfondo: +2 Destreza, +1 Constitución'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Criminal
    campo: caracteristicas
- en: creación
  eleccion: 'habilidades de clase: Percepción, Perspicacia, Engaño, Investigación'
  cita:
    archivo: clases/picaro.yaml
    campo: atributos_basicos.habilidades
- en: creación
  eleccion: 'herramienta de trasfondo: herramientas de ladrón (fija, no es elección)'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Criminal
    campo: herramienta
- en: creación
  eleccion: 'Pericia nivel 1: Juego de manos y Sigilo (recomendación explícita del rasgo)'
  cita:
    archivo: clases/rasgos/picaro.yaml
    rasgo: Pericia
- en: creación
  eleccion: 'Maestría con armas: Daga y Espada corta'
  cita:
    archivo: clases/rasgos/picaro.yaml
    rasgo: Maestría con armas
- en: creación
  eleccion: 'Jerga de ladrones (fija) más idioma a elección: Infracomún'
  cita:
    archivo: clases/rasgos/picaro.yaml
    rasgo: Jerga de ladrones
- en: creación
  eleccion: 'idiomas libres adicionales de la tabla estándar: Enano y Goblin'
  cita:
    archivo: reglas/idiomas.yaml
    campo: nota
- en: creación
  eleccion: equipo de clase opción A; equipo de trasfondo opción B (50 po)
  cita:
    archivo: clases/picaro.yaml
    campo: atributos_basicos.equipo_inicial
- en: creación
  eleccion: 'dote de trasfondo: Alerta (fija, no es elección)'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Criminal
    campo: dote
historia:
- Milo creció robando bolsillos en los muelles de una ciudad portuaria
- antes de que un gremio de ladrones lo reclutara al verlo forzar
- una cerradura con una horquilla.
- Un golpe salido mal lo dejó huyendo de su antiguo gremio
- con una bolsa de monedas robadas y ninguna intención de volver.
personalidad:
- 'Encantador y calculador a partes iguales: sonríe primero y evalúa'
- las salidas después.
- Desconfía de los tratos que suenan demasiado limpios y guarda
- siempre una ruta de escape, incluso en una conversación cordial.
