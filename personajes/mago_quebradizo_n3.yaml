decisiones:
- en: generación automática
  eleccion: conjunto estándar repartido por característica principal; PG siempre por
    valor establecido; mejoras a la principal. Es una heurística del generador, no
    una regla del manual.
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: metodos_generacion_caracteristicas.conjunto_estandar
- en: generación automática
