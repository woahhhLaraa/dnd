# Esta ficha entró en la base el 2026-09-06 y la eligió una lista, no una idea
# de personaje: `_verificacion/motor_sin_carga.json`, los trozos del motor que
# se pueden corromper sin que ninguna ficha se queje.
#
# **Ejercita el mínimo de 1 punto de golpe por nivel** (pdf 44 = libro 42,
# paso 2), que hasta hoy no sostenía nadie. Para eso hacen falta las tres cosas
# a la vez, y por eso la ficha es como es:
#
#   · Constitución 8 → modificador −1 (reparto legal del conjunto estándar,
#     solo cambia a qué característica va cada número);
#   · dado de golpe d6, el más pequeño del juego (Mago);
#   · una tirada de 1 en el nivel 2.
#
# 1 + (−1) = 0, y el mínimo lo sube a 1. Cambiar `max(1, …)` por `max(0, …)` en
# el motor deja los PG en 8 en vez de 9, y esta ficha lo grita. Sin ella, esa
# línea se podía borrar y las 25 fichas seguían en verde.
#
# El verificador avisa además de un límite YA declarado: cuando el mínimo se
# aplica, la base no resuelve qué pasa con la regla retroactiva del paso 5. No
# es un fallo de esta ficha; es el hueco de transcripción que ese aviso existe
# para no dejar olvidar.

nombre: Pello el Quebradizo
