decisiones:
- en: creación
  eleccion: 'características: conjunto estándar, orden sugerido de clase'
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: conjunto_estandar_por_clase
- en: creación
  eleccion: 'ajuste de trasfondo: +2 Fuerza, +1 Constitución'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Soldado
    campo: caracteristicas
- en: creación
  eleccion: 'habilidades de clase: Percepción, Supervivencia (sin solapar con Atletismo/Intimidación del trasfondo)'
  cita:
    archivo: clases/barbaro.yaml
    campo: atributos_basicos.habilidades
- en: creación
  eleccion: 'herramienta de trasfondo: Juego (variante Dados)'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Soldado
    campo: herramienta
- en: creación
  eleccion: 'equipo inicial de clase: opción A'
  cita:
    archivo: clases/barbaro.yaml
    campo: atributos_basicos.equipo_inicial
- en: creación
  eleccion: 'equipo inicial de trasfondo: opción A'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Soldado
    campo: equipo_a
- en: creación
  eleccion: 'dote de trasfondo: Atacante salvaje (fija, no es elección)'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Soldado
    campo: dote
- en: creación
  eleccion: 'idiomas libres adicionales: Orco y Goblin'
  cita:
    archivo: reglas/idiomas.yaml
    campo: nota
- en: creación
  eleccion: defensa sin armadura, sin escudo ni armadura equipados
  cita:
    archivo: clases/rasgos/barbaro.yaml
    rasgo: Defensa sin armadura
historia:
- Grosh sirvió una década en la guardia fronteriza de una ciudad humana
- que nunca terminó de confiar en él.
- Dejó las filas cuando su capitán cayó en una emboscada que Grosh
- predijo y nadie escuchó.
- Desde entonces vende su hacha al mejor postor, pero conserva la
- disciplina y la lealtad de quien fue soldado.
personalidad:
- Directo hasta la brusquedad, desconfía de las promesas bonitas y
- confía en las acciones.
- 'Bajo la furia de batalla hay un sentido del deber casi obsesivo:'
- no abandona a un compañero caído, cueste lo que cueste.
