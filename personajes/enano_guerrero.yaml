decisiones:
- en: corrección 2026-08-29 (Fase 14)
  eleccion: 'pg_max 12 → 13: el rasgo "Aguante enano" sube los PG máximos en 1 (y en 1 más por nivel) y esta ficha
    no lo aplicaba. Lo cazó el motor de efectos: antes el bono vivía en el campo-parche `bonus_pg_especie`, que
    nadie obligaba a rellenar, así que la ficha verificaba en verde con los PG mal.

    '
  cita:
    archivo: especies/especies.yaml
    registro: Enano
    campo: rasgos[Aguante enano]
- en: creación
  eleccion: 'método de características: conjunto estándar, intercambiando Des y Con del reparto sugerido para Guerrero
    (armadura pesada no usa mod. Des en la CA)'
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: conjunto_estandar_por_clase
- en: creación
  eleccion: 'ajuste de trasfondo: +2 Fuerza, +1 Sabiduría'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Guardia
    campo: caracteristicas
- en: creación
  eleccion: 'habilidades de clase: Intimidación, Perspicacia (sin solapar con Atletismo/Percepción del trasfondo)'
  cita:
    archivo: clases/guerrero.yaml
    campo: atributos_basicos.habilidades
- en: creación
  eleccion: 'herramienta de trasfondo: Juego, variante Dados'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Guardia
    campo: herramienta
- en: creación
  eleccion: equipo inicial opción A de clase y de trasfondo
  cita:
    archivo: clases/guerrero.yaml
    campo: atributos_basicos.equipo_inicial.a
- en: creación
  eleccion: 'oro sobrante sin gastar: 4 po (clase, opción A) + 12 po (trasfondo, opción A) = 16 po'
  cita:
    archivo: clases/guerrero.yaml
    campo: atributos_basicos.equipo_inicial.a
- en: creación
  eleccion: 'dote de Estilo de combate (rasgo de nivel 1): Combate con armas a dos manos, por el espadón a dos manos'
  cita:
    archivo: clases/rasgos/guerrero.yaml
    rasgo: Estilo de combate
- en: creación
  eleccion: 'maestría con armas (rasgo de nivel 1, 3 armas): Espadón, Mangual, Jabalina — sin campo dedicado en
    el esquema de ficha, se registra solo aquí'
  cita:
    archivo: clases/rasgos/guerrero.yaml
    rasgo: Maestría con armas
