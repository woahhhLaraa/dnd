# Esta ficha entró en la base el 2026-09-06 y de dónde sale importa: **la
# eligió la FILA 8 del censo, no una idea de personaje**. Esa fila cuenta los
# efectos declarados que ninguna ficha con lectura independiente sostiene —se
# pueden corromper y todo sigue verificando en verde—, y de las 18 que
# quedaban esta cierra 1:
#
#   · «Formas del círculo» del Círculo de la Luna
#
# Las siete fichas de esta tanda se diseñaron juntas para cubrir las 18 sin
# solaparse: es el único Círculo de la Luna de la base
#
# El `calculado` lo escribió el motor. Para que cuente en la fila 8 hace falta
# que un calculista a ciegas lo derive a mano y coincida — si no, sería el
# motor dándose la razón a sí mismo.

