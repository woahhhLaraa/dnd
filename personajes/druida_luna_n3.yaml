decisiones:
- en: generación automática
  eleccion: conjunto estándar repartido por característica principal; PG siempre por valor establecido;
    mejoras a la principal. Es una heurística del generador, no una regla del manual.
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: metodos_generacion_caracteristicas.conjunto_estandar
- en: generación automática
  eleccion: el equipo inicial vive como prosa en la base, así que esta ficha solo lleva armadura; el inventario
    queda vacío a propósito.
  cita:
    archivo: clases/druida.yaml
    campo: atributos_basicos.equipo_inicial
calculado:
  pg_max: 24
  ca: 13
  bonif_competencia: 2
  velocidad: 9
  cd_conjuros: 13
  bonif_ataque_conjuros: 5
  # Segunda transcripción: un agente ciego —recibió la ficha SIN este
  # bloque, vía `verificar_personaje.py --datos-crudos`— derivó a mano
  # los cinco (pg_max, ca, velocidad, cd_conjuros, bonif_ataque_conjuros)
  # citando fichero y página en cada paso, y COINCIDE con el motor.
  _origen:
    metodo: agente-manual
    informe: _verificacion/_aritmetica/druida_luna_n3-calculista-ciego.md
    fecha: '2026-09-06'
