  # página. Ver `PLAN_20_AUDITORIA.md` §1.2.
  _origen: {metodo: motor, informe: null, fecha: "2026-09-05"}
  pg_max: 143
  ca: 19
  bonif_competencia: 6
  velocidad: 18

decisiones:
  - en: "nivel 3"
    eleccion: "subclase: Guerrero de la Mano Abierta"
    cita: {archivo: "clases/monje.yaml", campo: "progresion[n=3].rasgos"}
  - en: "nivel 4"
    eleccion: "mejora de característica: Destreza +2 (15→17)"
    cita: {archivo: "clases/monje.yaml", campo: "progresion[n=4].rasgos"}
  - en: "nivel 8"
    eleccion: "mejora de característica: Sabiduría +2 (16→18)"
    cita: {archivo: "clases/monje.yaml", campo: "progresion[n=8].rasgos"}
  - en: "nivel 12"
    eleccion: "mejora de característica: Sabiduría +2 (18→20)"
    cita: {archivo: "clases/monje.yaml", campo: "progresion[n=12].rasgos"}
  - en: "nivel 16"
    eleccion: "mejora de característica: Destreza +2 (17→19)"
    cita: {archivo: "clases/monje.yaml", campo: "progresion[n=16].rasgos"}
  - en: "niveles 2-20"
    eleccion: "PG: valor establecido (5) en cada subida, sin tirar"
    cita: {archivo: "reglas/generacion_personaje.yaml", campo: "puntos_golpe.niveles_siguientes_al_1"}
  - en: "creación"
    eleccion: "método de características: conjunto estándar (reparto sugerido para Monje)"
    cita: {archivo: "reglas/generacion_personaje.yaml", campo: "conjunto_estandar_por_clase"}
  - en: "creación"
    eleccion: "ajuste de trasfondo: +2 Sabiduría, +1 Constitución"
    cita: {archivo: "trasfondos/trasfondos.yaml", registro: Ermitaño, campo: caracteristicas}
  - en: "creación"
    eleccion: "habilidades de clase: Acrobacias, Atletismo"
    cita: {archivo: "clases/monje.yaml", campo: "atributos_basicos.habilidades"}
  - en: "creación"
    eleccion: "linaje dracónico: Rojo (Fuego)"
    cita: {archivo: "especies/especies.yaml", registro: Dracónido, campo: "rasgos.Linaje dracónico"}
  - en: "creación"
    eleccion: "equipo inicial opción A (clase y trasfondo)"
    cita: {archivo: "clases/monje.yaml", campo: "atributos_basicos.equipo_inicial.a"}
  - en: "creación"
    eleccion: "idiomas elegidos: Dracónico, Enano (además de Común)"
    cita: {archivo: "reglas/idiomas.yaml", campo: "nota"}
