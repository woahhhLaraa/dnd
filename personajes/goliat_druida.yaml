  trucos:
  - ref: hechizos.json#Crear llama
    origen:
      clase: Druida
      rasgo: Lanzamiento de conjuros
  - ref: hechizos.json#Saber druídico
    origen:
      clase: Druida
      rasgo: Lanzamiento de conjuros
  - ref: hechizos.json#Guía
    origen:
      clase: Druida
      rasgo: Orden primigenia (Naturalista)
  - ref: hechizos.json#Rociada venenosa
    origen:
      dote: Iniciado en la magia
  - ref: hechizos.json#Resistencia
    origen:
      dote: Iniciado en la magia
  preparados:
  - ref: hechizos.json#Curar heridas
    origen:
      clase: Druida
      rasgo: Lanzamiento de conjuros
  - ref: hechizos.json#Encantar animal
    origen:
      clase: Druida
      rasgo: Lanzamiento de conjuros
  - ref: hechizos.json#Fuego feérico
    origen:
      clase: Druida
      rasgo: Lanzamiento de conjuros
  - ref: hechizos.json#Ola atronadora
