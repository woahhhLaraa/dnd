  - ref: hechizos.json#Buenas bayas
    origen:
      dote: Iniciado en la magia
      nota: siempre preparado, se lanza 1 vez sin gastar espacio, recuperable tras descanso largo
dotes:
- ref: dotes/origen.yaml#Iniciado en la magia
  origen:
    trasfondo: Guía
    lista: Druida
    aptitud_elegida: Sabiduría
calculado:
  pg_max: 10
  ca: 14
  bonif_competencia: 2
  cd_conjuros: 13
  bonif_ataque_conjuros: 5
  velocidad: 10.5
historia: 'Korrath creció entre los pasos de altura de su clan goliat, donde aprendió a leer el clima y las rutas
  antes que las letras. Se hizo guía de caravanas y peregrinos, y en ese oficio encontró a los círculos druídicos
  que custodian los pasos más antiguos; con ellos aprendió que guiar a los vivos y guiar a la tierra son la misma
  tarea.

  '
personalidad: 'Callado hasta que hace falta hablar, decide rápido y no repite el argumento dos veces.

  '
decisiones:
- en: creación
  eleccion: 'método de características: conjunto estándar (reparto sugerido por clase para Druida)'
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: conjunto_estandar_por_clase
- en: creación
  eleccion: 'ajuste de trasfondo: +2 Sabiduría, +1 Constitución (de las tres que ofrece Guía: Destreza, Constitución,
    Sabiduría)'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Guía
    campo: caracteristicas
- en: creación
  eleccion: 'linaje gigante de Goliat: Resistencia de la piedra'
  cita:
    archivo: especies/especies.yaml
    registro: Goliat
    campo: rasgos.Linaje gigante
- en: creación
  eleccion: 'habilidades de clase: Naturaleza, Trato con animales (sin repetir Supervivencia, que ya da el trasfondo)'
  cita:
    archivo: clases/druida.yaml
    campo: atributos_basicos.habilidades
- en: creación
  eleccion: 'Orden primigenia: Naturalista (truco adicional + bonificador de Sabiduría a Conocimiento arcano y Naturaleza)'
  cita:
    archivo: clases/rasgos/druida.yaml
    rasgo: Orden primigenia
- en: creación
  eleccion: 'equipo inicial de clase: opción A; equipo inicial de trasfondo: opción A'
  cita:
    archivo: clases/druida.yaml
    campo: atributos_basicos.equipo_inicial
- en: creación
  eleccion: 'trucos: Crear llama, Saber druídico (recomendados por el rasgo), Guía (por Naturalista)'
  cita:
    archivo: clases/rasgos/druida.yaml
    rasgo: Lanzamiento de conjuros
- en: creación
  eleccion: 'conjuros preparados de nivel 1: Curar heridas, Encantar animal, Fuego feérico, Ola atronadora (los
    cuatro recomendados por el rasgo)'
  cita:
    archivo: clases/rasgos/druida.yaml
    rasgo: Lanzamiento de conjuros
- en: creación
  eleccion: Druídico concede, sin contar contra el límite, hablar con los animales siempre preparado
  cita:
    archivo: clases/rasgos/druida.yaml
    rasgo: Druídico
- en: creación
  eleccion: 'dote de trasfondo Guía: Iniciado en la magia, lista druida, aptitud Sabiduría; trucos Rociada venenosa
    y Resistencia, conjuro Buenas bayas'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Guía
    campo: dote
- en: creación
  eleccion: 'idiomas libres adicionales: Gigante y Elfo, más Común y Druídico (este último por el rasgo, no por
    la regla general)'
  cita:
    archivo: reglas/idiomas.yaml
    campo: nota
