  origen:
    clase: Druida
    opcion: A
- ref: equipo/herramientas.yaml#Útiles de herborista
  origen:
    clase: Druida
    opcion: A
- ref: equipo/armas.yaml#Arco corto
  origen:
    trasfondo: Guía
    opcion: A
