  ref: clases/druida.yaml
  nivel: 1
  subclase: null
caracteristicas:
  metodo: conjunto_estandar
  base:
    fue: 8
    des: 12
    con: 14
    int: 13
    sab: 15
    car: 10
  ajuste_trasfondo:
    sab: 2
    con: 1
  final:
    fue: 8
    des: 12
    con: 15
    int: 13
    sab: 17
    car: 10
competencias:
  salvaciones:
  - Inteligencia
  - Sabiduría
  habilidades:
