decisiones:
- en: creación
  eleccion: 'método de características: conjunto estándar (15/14/13/12/10/8)'
  cita:
    archivo: reglas/generacion_personaje.yaml
    campo: metodos_generacion_caracteristicas.conjunto_estandar
- en: creación
  eleccion: 'tamaño de especie: Mediano'
  cita:
    archivo: especies/especies.yaml
    registro: Aasimar
    campo: tamano
- en: creación
  eleccion: 'ajuste de trasfondo: +2 Sabiduría, +1 Carisma'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Acólito
    campo: caracteristicas
- en: creación
  eleccion: 'habilidades de clase: Historia, Medicina (evitando duplicar Perspicacia/Religión, ya fijas por el trasfondo)'
  cita:
    archivo: clases/clerigo.yaml
    campo: atributos_basicos.habilidades
- en: creación
  eleccion: equipo inicial opción A (clase)
  cita:
    archivo: clases/clerigo.yaml
    campo: atributos_basicos.equipo_inicial.a
- en: creación
  eleccion: equipo inicial opción A (trasfondo)
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Acólito
    campo: equipo_a
- en: creación
  eleccion: 'trucos de clase: Guía, Llama sagrada, Taumaturgia (opciones recomendadas por el rasgo)'
  cita:
    archivo: clases/rasgos/clerigo.yaml
    rasgo: Lanzamiento de conjuros
- en: creación
  eleccion: 'preparados de clase: Bendición, Curar heridas, Escudo de fe, Saeta guía (recomendados por el rasgo)'
  cita:
    archivo: clases/rasgos/clerigo.yaml
    rasgo: Lanzamiento de conjuros
- en: creación
  eleccion: 'dote de trasfondo: Iniciado en la magia (lista clérigo, aptitud Sabiduría)'
  cita:
    archivo: trasfondos/trasfondos.yaml
    registro: Acólito
    campo: dote
- en: creación
  eleccion: 'trucos y conjuro extra de la dote: Piedad con los moribundos, Palabra de resplandor, Santuario'
  cita:
    archivo: dotes/origen.yaml
    registro: Iniciado en la magia
    campo: descripcion
- en: creación
  eleccion: 'idiomas: Común más Elfo y Enano, elección libre'
  cita:
    archivo: reglas/idiomas.yaml
    campo: nota
