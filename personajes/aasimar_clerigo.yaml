nombre: Ithariel Solvane
jugador: null
nivel_total: 1
historia:
- Criado desde niño en un templo de montaña, tras aparecer envuelto en luz al nacer.
- Tomó los votos de acólito en cuanto tuvo edad para ello.
- Su marca celestial despertó poco después, y los sacerdotes lo leyeron como un augurio.
- Lo enviaron al mundo a poner esa luz al servicio de quien la necesite.
personalidad:
- Sereno y metódico; habla poco, pero escucha mucho.
- Lleva un registro escrito de cada persona a la que ayuda.
- Cree que la fe se honra con memoria, no solo con oraciones.
especie:
  ref: especies/especies.yaml#Aasimar
  rasgos_elegidos:
    tamano: Mediano
trasfondo:
  ref: trasfondos/trasfondos.yaml#Acólito
clases:
