# ── Puntos de golpe ───────────────────────────────────────────────────────
# Añadido el 2026-08-30. Hasta hoy la base NO tenía la regla de PG de los
# niveles posteriores al 1: solo `dado_golpe` en las 12 clases y una mención de
# refilón dentro de `multiclase.puntos_golpe_y_dados_golpe`, que remitía a «los
# de niveles siguientes al 1» — una sección que nadie había escrito.
#
# Verificado por DOS lectores independientes de la misma página (pdf 44 =
# libro 42), sin verse los informes: `_verificacion/_auditoria_rasgos/
# agente-PG-A.md` y `agente-PG-B.md`. Coinciden literalmente.
puntos_golpe:
  nivel_1:
    regla: >
      Máximo del dado de golpe + modificador por Constitución.
    pagina: {pdf: 42, libro: 40}
    _nota: >
      Ya estaba implementada en `calculo.puntos_golpe_nivel_1()` con esta cita.
      Los dos lectores de pdf 44 confirman que esta regla NO aparece en la
      página de "Subir de nivel": son dos reglas distintas, en dos sitios.

  niveles_siguientes_al_1:
    pagina: {pdf: 44, libro: 42}
    seccion: "Subir de nivel, paso 2: Ajustar los puntos de golpe y los dados de golpe"
    fidelidad: literal
    literal: >
      Cada vez que subas un nivel, obtendrás un dado de golpe adicional. Tira
      ese dado, suma tu modificador por Constitución al resultado y añade el
      total (mínimo de 1) a tus puntos de golpe máximos. En vez de tirar,
      puedes utilizar el valor establecido que se muestra en la tabla "Puntos
      de golpe establecidos por clase".
    metodos:
      - id: tirar
        desc: "Tirar el dado de golpe y sumar el modificador por Constitución."
        minimo: 1        # el MÍNIMO es del TOTAL (dado + mod), no del dado
      - id: valor_establecido
        desc: >
          Usar el valor fijo de la tabla "Puntos de golpe establecidos por
          clase" en vez de tirar. Es una opción del jugador, no un promedio
          que la base pueda calcular por su cuenta.
    tabla_valores_establecidos:
      titulo: "Puntos de golpe establecidos por clase"
      columnas: ["Clase", "Puntos de golpe por nivel"]
      filas:
        - {clases: [Bárbaro], valor: 7}
        - {clases: [Explorador, Guerrero, Paladín], valor: 6}
        - {clases: [Bardo, Brujo, Clérigo, Druida, Monje, Pícaro], valor: 5}
        - {clases: [Hechicero, Mago], valor: 4}
      _todas_las_clases: true   # las 12; validar.py lo comprueba

  aumento_de_constitucion:
    pagina: {pdf: 44, libro: 42}
    seccion: "Subir de nivel, paso 5: Ajustar los modificadores por característica"
    fidelidad: literal
    literal: >
      Cuando tu modificador por Constitución aumente en 1, tus puntos de golpe
      máximos también aumentarán en 1 por cada nivel que hayas alcanzado. Por
      ejemplo, si un personaje alcanza el nivel 8 y aumenta su puntuación de
      Constitución de 17 a 18, el modificador por Constitución pasará a ser de
      +4. Los puntos de golpe máximos del personaje aumentarán en 8, más los
      puntos de golpe obtenidos al alcanzar el nivel 8.
    _es_retroactivo: true
    _nota_para_el_motor: >
      Esto es lo que rompe el modelo plano y conviene leerlo antes de escribir
      nada: los PG máximos NO son la suma de lo que se obtuvo en cada nivel.
      El término de Constitución es `nivel_total × mod_con` y se recalcula
      entero cuando el modificador sube; solo el término del dado es historia
      acumulada. Un motor que sume "lo ganado en el nivel N" y lo guarde da el
      número correcto hasta la primera dote que suba Constitución, y a partir
      de ahí se equivoca en silencio.

# ── Conjuros: CD de salvación y bonificador de ataque ────────────────────
# Entró en la base el 2026-09-05, y de dónde venía importa: la fórmula que
# gobierna la CD de TODO lanzador vivía solo en `calculo.py`, con su cita de
# página en un COMENTARIO de Python — justo donde este proyecto ha decidido
# que una regla no puede vivir, porque una regla cableada no se puede citar,
# ni validar, ni corregir cuando la base cambia.
#
# No es una transcripción nueva: la página SE LEYÓ en su día. `FUENTES.md`
# registra que las funciones de `calculo.py` se contrastaron «contra el manual
# (pdf 42, 240)» en la Fase 8a. Lo que faltó fue traer el dato a la base; se
# quedó a medio camino, en el código.
#
# Lo destapó el mandato «el calculista» de la ronda 3 de estrés: DOS agentes
# independientes calcularon a mano los cinco valores derivados de dos fichas
# distintas y los dos pararon en el mismo sitio, con la misma frase — ningún
# fichero de la base define la fórmula, los rasgos la usan como término ya
# conocido («…CD igual a tu CD de conjuros…») sin decir cuál es.
conjuros:
  pagina: {pdf: 240, libro: 238}
  seccion: "Tiradas de salvación / Tiradas de ataque"
  cd_salvacion:
    formula: "8 + modificador de aptitud mágica + bonificador por competencia"
    base: 8
  bonificador_ataque:
    formula: "modificador de aptitud mágica + bonificador por competencia"
    base: 0
  _nota_aptitud: >
    La aptitud mágica de cada clase la declara su propio fichero, en
    `clases/<clase>.yaml → aptitud_magica`. Aquí solo vive la fórmula que
    la combina con el bonificador por competencia.

