# ══ PENDIENTES — deuda declarada, con el bloque que la cierra ════════════
pendientes:

  # ── Caso 7 del §2: lo que queda sin contraste externo ─────────────────
  - unidad: "columna:druida.forma_salvaje"
    bloque: "H"
    motivo: "el SRD de Open5e no publica esta columna. Sí está en `_verificacion/foundry_srd52/classes24` como advancement `ScaleValue`, que hoy no contrasta nadie"
  - unidad: "columna:monje.mov_sin_armadura_m"
    bloque: "H"
    motivo: "ídem, y además la LEE el motor de efectos (`columna:` del rasgo «Movimiento sin armadura»): un error aquí sale directamente en la velocidad de la ficha"

  # ── Caso 8 del §2: categorías de dato externo sin contrastar ──────────
  # Medido por el censo: 9 de los 17 pares (carpeta, `type`) del SRD 5.2
  # estructurado no los pide ningún módulo. `MODULOS` no «se quedó corta»
  # por descuido: nunca hubo módulo para estas categorías, y sin el censo
  # eso no era visible desde ningún sitio.
  - unidad: "externo:classes24/feat"
    bloque: "H"
    motivo: "255 rasgos de clase y subclase del SRD 5.2, la superficie más grande sin contrastar de todo el repo. Es además la fuente de la «Foundry Note» que el §7bis quiere para el bloque D: dice qué automatiza Foundry y qué no"
  - unidad: "externo:classes24/class"
    bloque: "H"
    motivo: "las 12 clases con sus advancements (dado de golpe, competencias, `ScaleValue` por nivel); cerraría también `forma_salvaje` y `mov_sin_armadura_m`"
  - unidad: "externo:classes24/subclass"
    bloque: "H"
    motivo: "las 12 subclases del SRD; nuestras 48 salen del manual, así que el contraste sería parcial por construcción y hay que decidir qué se espera antes de escribirlo"
  - unidad: "externo:classes24/weapon"
    bloque: "H"
    motivo: "3 armas que Foundry guarda dentro del pack de clases (equipo inicial); su contraste natural es el módulo `armas`, que hoy solo mira `equipment24`"
  - unidad: "externo:equipment24/consumable"
    bloque: "H"
    motivo: "159 consumibles (pociones, pergaminos, munición). La base transcribe munición en `equipo/municion.yaml` y no la contrasta contra esto"
  - unidad: "externo:equipment24/container"
    bloque: "H"
    motivo: "40 contenedores (mochilas, sacos, cofres); parte de `equipo/aventureros.yaml` sin contraste externo"
  - unidad: "externo:equipment24/loot"
    bloque: "H"
    motivo: "35 registros de botín y materiales; se solapan con los componentes materiales que `validar_materiales` ya descompone por precio"
  - unidad: "externo:origins24/feat"
    bloque: "H"
    motivo: "36 dotes que viven en el pack de orígenes, no en `feats24`. `verificar_dotes` solo pide `feats24/feat` (17), así que las dotes de origen —que la base sí tiene en `dotes/origen.yaml`— no se contrastan"
  - unidad: "externo:spells24/consumable"
    bloque: "H"
    motivo: "1 registro suelto dentro del pack de conjuros; se declara para que el par (carpeta, type) quede contado y no reaparezca como sorpresa"
  - unidad: "externo:tables24/None"
    bloque: "H"
    motivo: "45 tablas de tirada (creación de personaje, objetos mágicos, conjuros) sin campo `type`. La base no modela tablas de tirada, así que antes que un módulo hace falta decidir si entran"

  # ── Caso 6 del §2 · CERRADO el 2026-09-02 ─────────────────────────────
  # Aquí vivieron los 19 chequeos `validar_*` sin prueba por mutación, uno a
  # uno, para verlos tachar. El bloque B los cerró todos: `censo.py` cuenta
  # hoy 30/30 con suite, y esta sección está vacía a propósito — que no quede
  # ni una línea es el resultado, no un descuido.

  # ── Bloques C y D · los rasgos que no declaran efecto ─────────────────
  # Comodín a propósito: son 521 registros y listarlos uno a uno serían 1500
  # líneas que nadie leería — y un manifiesto que nadie lee es la novena
  # lista a mano. El censo imprime el recuento en cada pasada, así que el
  # número se ve bajar (bloque C) y se ve crecer si alguien añade rasgos sin
  # declarar nada.
  #
  # Y no son 521 huecos funcionales: solo hay 3 variables calculables, así
  # que el hueco real son los ~21 rasgos del bloque C. Los demás se cierran
  # con `no_automatizado:` en el bloque D, que es la «Foundry Note»: decir
  # «lo miramos y no toca» en vez de callarse.
  - unidad: "rasgo:*"
    bloque: "C+D"
    motivo: "rasgo sin `efectos:` ni `no_automatizado:`. Hoy la frontera entre «no lo hemos mirado» y «lo miramos y no toca» es el silencio; el bloque D la mete en el dato"
