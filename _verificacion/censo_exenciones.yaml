  # ── Módulos de la raíz sin función auditable (caso 6 del §2) ──────────
  # `verificar_chequeos.py` busca ramas que abandonen un registro en silencio
  # dentro de `validar_*`, `verificar_*` y `main`. Estos dos no tienen ninguna
  # de las tres porque no son herramientas: son bibliotecas que otros módulos
  # importan, y sus funciones LANZAN en vez de saltarse registros —que es lo
  # contrario de callarse—. Se declaran para que un módulo nuevo sin chequeos
  # tenga que pasar por aquí en vez de colarse.
  - unidad: "modulo:materiales.py"
    motivo: "biblioteca de descomposición de costes de material; la usa validar_materiales(), que sí se audita, y lanza ante lo que no entiende"
  - unidad: "modulo:prerrequisitos.py"
    motivo: "biblioteca de la gramática de prerrequisitos (Fase 15); lanza `ErrorDePrerrequisito` ante lo que no sabe evaluar, y quien la audita es validar_prerrequisitos()"

  # ── Espacios de conjuro: cerrado el 2026-09-02 (bloque A2, caso 7) ────
  # El SRD de Open5e solo publica los espacios del Brujo (`espacios`, ya en
  # MAPA), así que estas 7 columnas no tienen contraparte externa. Estuvieron
  # declaradas como PENDIENTES mientras el contraste se hacía contra los
  # literales `COMPLETO`/`MEDIO` de `validar.py`, que no tenían cita: una
  # autoridad sin fuente por encima de una base citada. Ya no.
  # Ahora `validar_clase` las contrasta contra la tabla CITADA de
  # `reglas/generacion_personaje.yaml` (pdf 47 = libro 45) —y la del lanzador
  # medio se DERIVA de ella con la regla que el manual imprime al lado—, así
  # que la unidad sí está alcanzada, por otro camino que el de MAPA.
  - unidad: "columna:bardo.slots"
    motivo: "el SRD de Open5e no publica esta columna; la contrasta `validar_clase` contra la tabla citada de reglas/generacion_personaje.yaml (pdf 47 = libro 45)"
