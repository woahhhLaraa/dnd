# Manifiesto del censo (Bloque A del PLAN_18 — 2026-09-02).
#
# ── Qué es esto ──────────────────────────────────────────────────────────
# `censo.py` enumera seis clases de unidad de la base y exige que cada una
# esté ALCANZADA POR NOMBRE por algún chequeo. Lo que no lo está se declara
# aquí, una a una y con motivo. No es una lista de perdón: es la forma de
# decir «lo hemos mirado», que es exactamente lo que faltaba en los ocho
# casos del §2 del plan.
#
# Dos clases de declaración, y la diferencia es la que importa:
#
#   exentas    — la unidad NO debe ser alcanzada por ese alcanzador, y aquí
#                se dice QUIÉN responde por ella. Es permanente.
#   pendientes — es un hueco REAL y conocido, con el bloque del plan que lo
#                cierra. Es deuda declarada, y solo puede bajar.
#
# Una declaración que ya no corresponda a ninguna unidad hace fallar al
# censo: el manifiesto no puede pudrirse en silencio, que es como empezaron
# los ocho. Los comodines (`prefijo:*`) solo valen en `pendientes`, y el
# informe imprime siempre cuántas unidades cubre cada uno.
edicion: "2024 (5.5e)"
verificado: {metodo: "estructural", fecha: "2026-09-02"}

