# ══ PENDIENTES — deuda declarada, con el bloque que la cierra ════════════
pendientes:

  # ── Caso 7 del §2: lo que queda sin contraste externo ─────────────────

  # ── Caso 8 del §2: categorías de dato externo sin contrastar ──────────
  # Medido por el censo. Desde el 2026-09-03 la unidad no es el par
  # (carpeta, `type`) sino la terna (carpeta, REBANADA, `type`): el pack se
  # agrupa él solo en subcarpetas, y `classes24/feat` metía en el mismo saco
  # cuatro cosas con cuatro contrastes distintos —rasgos de clase, rasgos de
  # subclase, metamagias e invocaciones—. Con la terna, cerrar una rebanada
  # deja de dar por cerradas las otras tres.
  #
  # De `classes24` ya no queda casi nada: `class-features/feat` (159) lo cerró
  # `verificar_rasgos_clase()`, y `subclass` (12) más las doce carpetas de
  # rasgos de subclase (58) las cerró `verificar_subclases()` con el puente de
  # `_verificacion/glosario_subclases.yaml`, que es de nombres propios y se
  # audita a mano igual que el de las especies. Ahí está escrito por qué no se
  # deduce: se probaron el vector de niveles (no discrimina) y la huella
  # numérica del texto (acierta 10 de 12 — se equivoca en bardo y empata a
  # cuatro en paladín).

  - unidad: "externo:classes24/metamagic-options/feat"
    bloque: "H"
    motivo: "las 10 metamagias del SRD. Nuestra base las trae en el rasgo «Metamagia» del hechicero como un bloque de texto, no como registros con nombre, así que antes que el módulo hace falta decidir si se modelan una a una"
  - unidad: "externo:classes24/eldritch-invocation-options/feat"
    bloque: "H"
    motivo: "28 invocaciones sobrenaturales del SRD. Mismo problema de forma que las metamagias, y además el SRD publica un subconjunto del manual, así que el contraste sería parcial por construcción"
  - unidad: "externo:classes24/eldritch-invocation-options/weapon"
    bloque: "H"
    motivo: "1 arma que el pack guarda dentro de las invocaciones (el Pacto de la Espada); su contraste natural es el módulo `armas`, que hoy solo mira `equipment24`"
  - unidad: "externo:classes24/class-features/weapon"
    bloque: "H"
    motivo: "2 armas que el pack guarda dentro de los rasgos de clase (el Golpe sin armas del bárbaro y el del monje); su contraste natural es el módulo `armas`, que hoy solo mira `equipment24`"
  - unidad: "externo:equipment24/*/consumable"
    bloque: "H"
    motivo: "159 consumibles (pociones, pergaminos, munición) repartidos en 25 carpetas del pack. La base transcribe munición en `equipo/municion.yaml` y no la contrasta contra esto"
  - unidad: "externo:equipment24/*/container"
    bloque: "H"
    motivo: "40 contenedores (mochilas, sacos, cofres) repartidos en 30 carpetas; parte de `equipo/aventureros.yaml` sin contraste externo"
  - unidad: "externo:equipment24/*/loot"
    bloque: "H"
    motivo: "35 registros de botín y materiales; se solapan con los componentes materiales que `validar_materiales` ya descompone por precio"
  - unidad: "externo:origins24/*/feat"
    bloque: "H"
    motivo: "MEDIDO el 2026-09-02 y NO son dotes, como suponía el plan: son los 36 RASGOS DE ESPECIE de 9 especies (Foundry los guarda como `feat` sin subtipo, y por eso `verificar_dotes` los saltaba). El contraste 1:1 no vale porque la granularidad difiere a propósito: Foundry parte «Elven Lineage» en tres registros (Drow, High, Wood) y «Giant Ancestry» en seis, mientras nuestra tabla los agrupa en un rasgo como hace la página. Contrastarlos por nombre exigiría traducir, que es justo lo que este verificador no hace. Hace falta decidir la forma del contraste —candidato: huella numérica del texto, como en armas— antes de escribirlo"
  - unidad: "externo:spells24/supplemental-items/consumable"
    bloque: "H"
    motivo: "1 registro suelto dentro del pack de conjuros; se declara para que la terna quede contada y no reaparezca como sorpresa"
  - unidad: "externo:tables24/*/None"
    bloque: "H"
    motivo: "45 tablas de tirada (creación de personaje, objetos mágicos, conjuros) sin campo `type`, en 8 carpetas. La base no modela tablas de tirada, así que antes que un módulo hace falta decidir si entran"

